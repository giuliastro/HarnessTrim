name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Benchmark (fails if signal fidelity drops)
        run: pnpm run bench
      - name: Validate version/tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: node scripts/validate-release.mjs "$([ "$REF_TYPE" = "tag" ] && echo "$REF_NAME")"
      - name: CLI build
        run: node packages/cli/build.mjs
      - name: Clean-package smoke test (npm pack -> fresh install)
        run: bash packages/cli/smoke-test-gate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-benchmark-evidence
          path: |
            benchmarks/reports/latest.json
            benchmarks/reports/hook-replay.json
          if-no-files-found: error


  publish:
    name: publish
    needs: quality
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - name: Refuse publish-time bin stripping
        working-directory: packages/cli
        run: |
          npm publish --dry-run --json >/tmp/harnesstrim-publish.json 2>/tmp/harnesstrim-publish.stderr
          cat /tmp/harnesstrim-publish.stderr
          if grep -Eq 'bin\\[harnesstrim\\].*(invalid|removed)|script name .* was invalid and removed' /tmp/harnesstrim-publish.stderr; then
            echo "npm publish would remove the harnesstrim executable" >&2
            exit 1
          fi
          expected="$(node -p "require('./package.json').version")"
          actual="$(node dist/cli.mjs --version)"
          test "$actual" = "$expected" || {
            echo "bundle says $actual but package.json says $expected" >&2
            exit 1
          }

      - name: npm publish (harnesstrim)
        working-directory: packages/cli
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: release-benchmark-evidence
          path: release-evidence
      - name: Pack the published executable
        working-directory: packages/cli
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Create GitHub release with package and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          NOTES="docs/releases/$VERSION.md"
          if [ -f "$NOTES" ]; then
            gh release create "v$VERSION" --generate-notes --notes-file "$NOTES" \
              "$RUNNER_TEMP/harnesstrim-$VERSION.tgz" release-evidence/*.json
          else
            gh release create "v$VERSION" --generate-notes \
              "$RUNNER_TEMP/harnesstrim-$VERSION.tgz" release-evidence/*.json
          fi
