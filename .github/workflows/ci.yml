name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Benchmark (fails if signal fidelity drops)
        run: pnpm run bench

  # The same clean-package gate the release workflow runs, moved forward to every PR.
  # It catches what `pnpm run test` structurally cannot: whether the published tarball
  # works, and whether the assertions in smoke-test.sh still match real CLI output.
  # Running it only at release meant a broken assertion could sit on main until a tag.
  # ubuntu only, matching the release job - the script is bash/POSIX (mktemp, timeout,
  # an executable node_modules/.bin entry).
  smoke:
    name: clean-package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: CLI build
        run: node packages/cli/build.mjs
      - name: Clean-package smoke test (npm pack -> fresh install)
        run: bash packages/cli/smoke-test-gate.sh
      # Temporary branch-only baseline for offline development. No credentials,
      # .git directory, user configuration or environment files are archived.
      - name: Capture validation workspace
        if: github.head_ref == 'feature/codex-claude-quality-0.3.0'
        run: |
          mkdir -p /tmp/harnesstrim-validation
          git archive --format=tar HEAD | gzip > /tmp/harnesstrim-validation/source.tar.gz
          tar -czf /tmp/harnesstrim-validation/dependencies.tar.gz node_modules packages/*/node_modules benchmarks/node_modules
          cp "$(command -v node)" /tmp/harnesstrim-validation/node
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'feature/codex-claude-quality-0.3.0'
        with:
          name: harnesstrim-validation-workspace
          path: /tmp/harnesstrim-validation
          retention-days: 1

  hermes-plugin:
    name: hermes python plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hermes plugin payload tests
        run: python packages/adapter-hermes/test/plugin-payload.test.py
